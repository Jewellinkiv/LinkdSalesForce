name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: linkd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkd -d linkd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://linkd:test-only@localhost:5432/linkd
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
