services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkd
      POSTGRES_USER: linkd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - linkd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkd -d linkd"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  linkd_postgres:
